name: core_layer_runtime
description: "FEBRIC Layer Runtime (Scope B): the runtime orchestration layer that holds the active layer reference, exposes the frozen LayerModel traversal, emits existing frozen document commands (create/delete/move/rename/setLayerMetadata, design-node structural movement — M19 NDH-1 Form A — design-node structural/attribute editing — M21 Form A — and asset registration, the frozen ADR-0016 command bus) and forwards them to the document runtime (DocumentEngine.apply). Never mutates LayerModel or DesignNode, never reduces commands itself, never replaces the document reducer. Introduces zero new layer or node semantics — pure composition of the frozen core_layer, core_textile and core_document contracts."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  core_document:
    path: ../core_document
  core_layer:
    path: ../core_layer
  core_textile:
    path: ../core_textile
  meta: ^1.16.0

dev_dependencies:
  test: ^1.25.0
