name: feature_canvas_editor
description: "FEBRIC Canvas editor: workspace tools, selection, transforms."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  core_common:
    path: ../core_common
  core_document:
    path: ../core_document
  core_rendering:
    path: ../core_rendering
  core_imaging:
    path: ../core_imaging
  core_design_system:
    path: ../core_design_system
  # The frozen rendering / canvas / interaction contracts the Flutter render
  # driver implements and drives. Every one is a pure-Dart core package and
  # none is redefined here.
  core_canvas:
    path: ../core_canvas
  core_canvas_runtime:
    path: ../core_canvas_runtime
  core_geometry:
    path: ../core_geometry
  core_interaction:
    path: ../core_interaction
  core_layer:
    path: ../core_layer
  core_performance:
    path: ../core_performance
  core_render:
    path: ../core_render

dev_dependencies:
  flutter_test:
    sdk: flutter
  core_textile:
    path: ../core_textile
